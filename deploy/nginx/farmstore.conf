# Nginx server block for farmstore.
#
# Install:
#   sudo cp deploy/nginx/farmstore.conf /etc/nginx/sites-available/farmstore
#   sudo ln -s /etc/nginx/sites-available/farmstore /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#
# Replace:
#   - yourfarmdomain.com  -> your real domain
#   - /home/deploy/farmstore -> the actual path where you deployed the project
#
# Get a free TLS certificate with certbot (run AFTER this config is live on
# port 80, so certbot can complete its HTTP challenge):
#   sudo apt-get install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d yourfarmdomain.com

upstream farmstore_app {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name yourfarmdomain.com;

    client_max_body_size 10M;  # allow product image uploads

    access_log /var/log/nginx/farmstore.access.log;
    error_log  /var/log/nginx/farmstore.error.log;

    location /static/ {
        alias /home/deploy/farmstore/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        alias /home/deploy/farmstore/media/;
        expires 7d;
    }

    location / {
        proxy_pass http://farmstore_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# After running certbot, it will add a second `server { listen 443 ssl; }`
# block above (or modify this one) and a redirect from port 80 to 443
# automatically. You shouldn't need to write that part by hand.
