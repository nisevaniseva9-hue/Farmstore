<div class="col">
    <div class="card h-100 product-card">
        <div class="card-img-wrapper">
            {% if product.primary_image %}
                <img src="{{ product.primary_image.image.url }}" class="card-img-top" alt="{{ product.name }}">
            {% else %}
                <div class="d-flex align-items-center justify-content-center text-muted h-100 fs-5">
                    🌱 Fresh
                </div>
            {% endif %}
        </div>
        <div class="card-body d-flex flex-column p-3">
            <div class="d-flex justify-content-between align-items-start mb-2">
                <h5 class="card-title mb-0">
                    <a href="{% url 'catalog:product_detail' product.slug %}" class="product-title">
                        {{ product.name }}
                    </a>
                </h5>
            </div>
            <div class="mb-2">
                {% include "partials/stock_badge.html" %}
            </div>
            <div class="mb-3">
                <span class="price-tag">₹{{ product.price }}</span>
                <span class="price-unit">/ {{ product.get_unit_display }}</span>
            </div>
            <div class="mt-auto d-flex gap-2">
                <a href="{% url 'catalog:product_detail' product.slug %}" class="btn btn-outline-secondary btn-sm">
                    Details
                </a>
                {% if product.is_in_stock %}
                    <form method="post" action="{% url 'orders:cart_add' product.pk %}" class="flex-grow-1">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ request.path }}">
                        <input type="hidden" name="quantity" value="{{ product.minimum_order_quantity }}">
                        <button type="submit" class="btn btn-success btn-sm w-100">
                            + Add to Cart
                        </button>
                    </form>
                {% else %}
                    <button class="btn btn-secondary btn-sm flex-grow-1" disabled>Out of Stock</button>
                {% endif %}
            </div>
        </div>
    </div>
</div>
