<div class="col">
    <div class="card h-100 product-card">
        <div class="card-img-wrapper">
            {% if product.primary_image %}
                <img src="{{ product.primary_image.image.url }}" class="card-img-top" alt="{{ product.name }}">
            {% else %}
                <div class="d-flex align-items-center justify-content-center text-muted h-100 fs-5">
                    🌱 Fresh
                </div>
            {% endif %}
        </div>
        <div class="card-body d-flex flex-column p-2 p-md-3">
            <div class="d-flex justify-content-between align-items-start mb-1 mb-md-2">
                <h5 class="card-title mb-0 fs-6 fs-md-5">
                    <a href="{% url 'catalog:product_detail' product.slug %}" class="product-title text-truncate d-block">
                        {{ product.name }}
                    </a>
                </h5>
            </div>
            <div class="mb-1 mb-md-2">
                {% include "partials/stock_badge.html" %}
            </div>
            <div class="mb-2 mb-md-3">
                <span class="price-tag fs-6 fs-md-5">₹{{ product.price }}</span>
                <span class="price-unit small text-muted">/ {{ product.get_unit_display }}</span>
            </div>
            <div class="mt-auto d-flex gap-1 gap-md-2">
                <a href="{% url 'catalog:product_detail' product.slug %}" class="btn btn-outline-secondary btn-sm d-none d-sm-inline-block px-2">
                    Details
                </a>
                {% if product.is_in_stock %}
                    <form method="post" action="{% url 'orders:cart_add' product.pk %}" class="flex-grow-1">
                        {% csrf_token %}
                        <input type="hidden" name="next" value="{{ request.path }}">
                        <input type="hidden" name="quantity" value="{{ product.minimum_order_quantity }}">
                        <button type="submit" class="btn btn-success btn-sm w-100 py-1 px-2 d-flex align-items-center justify-content-center gap-1">
                            <span>+ Add</span><span class="d-none d-md-inline"> to Cart</span>
                        </button>
                    </form>
                {% else %}
                    <button class="btn btn-secondary btn-sm flex-grow-1 py-1" disabled>Sold Out</button>
                {% endif %}
            </div>
        </div>
    </div>
</div>
