{% extends "base.html" %}
{% block title %}My Profile - {{ FARM_NAME }}{% endblock %}
{% block content %}
<h2 class="mb-4">My Profile</h2>
<div class="row">
    <div class="col-md-6">
        <form method="post" novalidate>
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label" for="id_{{ field.name }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <div class="text-danger small">{{ error }}</div>
                    {% endfor %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-success">Save Changes</button>
        </form>
        <p class="mt-3">
            <a href="{% url 'accounts:password_change' %}">Change password</a>
        </p>
    </div>
</div>
{% endblock %}
