{% extends "base.html" %}
{% block title %}Delete Address - {{ FARM_NAME }}{% endblock %}
{% block content %}
<h2 class="mb-4">Delete Address</h2>
<p>Are you sure you want to delete the address for <strong>{{ address.full_name }}</strong>, {{ address.city }}?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Yes, Delete</button>
    <a href="{% url 'accounts:address_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
