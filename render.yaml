databases:
  - name: farmstore-db
    plan: free
    region: oregon

services:
  - type: web
    name: farmstore
    env: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "python manage.py migrate && python manage.py auto_init && gunicorn config.wsgi:application"
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: farmstore-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: SECURE_SSL_REDIRECT
        value: "True"
      - key: WHATSAPP_PROVIDER
        value: "console"
      - key: ALLOWED_HOSTS
        value: "*"

